[project]
name = "lianli-hydroshift-macos"
version = "0.1.0"
description = "macOS/Linux daemon for Lian Li HydroShift II wireless AIO fan and pump control"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyusb>=1.2.1"]

[project.scripts]
lianli-hydroshift = "lianli_hydroshift.daemon:main"

[tool.pytest.ini_options]
pythonpath = ["."]
